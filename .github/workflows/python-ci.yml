name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Create a Python 3.15 virtual environment
      run: uv venv --python 3.15

    - name: Install dependencies
      run: uv pip install -r requirements.txt

    - name: Run tests
      run: .venv/bin/python -m pytest tests/ -v --cov=src

    - name: Verify the frozen evaluation protocol
      run: .venv/bin/python -m study.protocol verify

    - name: Check the README result tables against the result files
      run: .venv/bin/python -m study.report --check
